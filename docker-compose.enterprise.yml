services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-metrics-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: AI Metrics Backend
      APP_ENV: staging
      APP_VERSION: 1.0.0
      DATABASE_URL: postgresql+psycopg://ai_metrics:${POSTGRES_PASSWORD:-change-me}@postgres:5432/ai_metrics
      DATABASE_POOL_SIZE: 10
      DATABASE_MAX_OVERFLOW: 20
      DATABASE_POOL_RECYCLE_SECONDS: 1800
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: INFO
      ENABLE_OPENAPI: ${ENABLE_OPENAPI:-true}
      ENABLE_REQUEST_LOGGING: true
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-false}
    ports:
      - "8201:8201"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8201/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: ai-metrics-postgres
    environment:
      POSTGRES_DB: ai_metrics
      POSTGRES_USER: ai_metrics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_metrics -d ai_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-metrics-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
