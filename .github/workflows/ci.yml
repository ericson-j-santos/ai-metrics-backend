name: CI — AI Metrics Backend

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Dependency integrity
        run: pip check

      - name: Compile Python sources
        run: python -m compileall app tests

      - name: Validate production settings guard rails
        env:
          APP_ENV: production
          DATABASE_URL: sqlite:///./ai_metrics.db
          CORS_ORIGINS: "*"
          ENABLE_OPENAPI: "true"
          REQUIRE_HTTPS: "false"
        run: |
          python - <<'PY'
          from pydantic import ValidationError
          from app.core.config import Settings

          try:
              Settings()
          except ValidationError as exc:
              message = str(exc)
              assert 'DATABASE_URL não pode usar SQLite em production.' in message
          else:
              raise SystemExit('Production guard rails should reject unsafe settings')
          PY

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ai_metrics_test.db
        run: python -m pytest tests/ -v --tb=short
